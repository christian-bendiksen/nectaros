name: Nectar OS

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build and sign image
        uses: blue-build/github-action@v1.9
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          maximize_build_space: false
          use_unstable_cli: true
          cli_version: latest

      - name: Show image ref
        run: echo "✅ Signed & built ghcr.io/${{ github.repository_owner }}/nectar:latest"

