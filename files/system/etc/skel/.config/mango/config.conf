# env variables
# Qt
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_AUTO_SCREEN_SCALE_FACTOR,2
env=QT_QPA_PLATFORM,Wayland;xcb
env=XDG_SESSION_TYPE,wayland
env=GDK_BACKEND,wayland,x11
env=CLUTTER_BACKEND,wayland

# firefox
env = MOZ_ENABLE_WAYLAND,1

# electron >28 apps (may help)
env = ELECTRON_OZONE_PLATFORM_HINT,auto

env=GTK_IM_MODULE,fcitx
env=QT_IM_MODULE,fcitx
env=SDL_IM_MODULE,fcitx
env=XMODIFIERS,@im=fcitx
env=GLFW_IM_MODULE,ibus

# Monitors - Uncomment this and set your monitor if on vm
monitorrule=eDP-1,0.55,1,tile,0,2,0,0,3840,2400,120.001

# Application Keybinds
bind=SUPER,Return,spawn, ptyxis -s
bind=SUPER,a,spawn,rofi -show drun
bind=SUPER,e,spawn,nautilus
bind=SUPER+SHIFT,m,quit
bind=SUPER+SHIFT,s,spawn,grim

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER,i,incnmaster,+1
bind=SUPER,p,incnmaster,-1
bind=SUPER,q,killclient
bind=SUPER+SHIFT,r,reload_config

# Layouts
bind=SUPER,t,setlayout,tile
bind=SUPER,v,setlayout,vertical_grid
bind=SUPER,c,setlayout,vertical_spiral
bind=SUPER,x,setlayout,scroller
bind=SUPER,n,switch_layout
bind=SUPER,g,togglegaps
bind=SUPER,w,toggleoverview

# Layouts in mango are per tag. So we'll set all tags to tile by default. 
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

animations=1
gappih=8
gappiv=8
gappoh=8
gappov=8
borderpx=1
border_radius=0
no_border_when_single=0
focuscolor=0xcba6f7ff

# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_left,toggleoverview,-1

# Mouse Wheel Bindings
axisbind=SUPER,UP,viewtoleft
axisbind=SUPER,DOWN,viewtoright

# options
repeat_rate=35
repeat_delay=200

# Effect
blur=0
blur_layer=1
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 1
shadow_only_floating=1
shadows_size = 12
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

# Animation Configuration
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=slide 
layer_animation_type_open=slide
layer_animation_type_close=slide 
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.3
zoom_end_ratio=0.7
fadein_begin_opacity=0.6
fadeout_begin_opacity=0.8

animation_duration_move=180
animation_duration_open=200
animation_duration_tag=250
animation_duration_close=200

animation_curve_open=0.25,1.0,0.5,1.0
animation_curve_move=0.25,1.0,0.5,1.0
animation_curve_tag=0.25,1.0,0.5,1.0
animation_curve_close=0.25,1.0,0.5,1.0

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.90
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER,m,togglemaximizescreen,

# smartmovewin
bind=CTRL+SHIFT,Up,smartmovewin,up
bind=CTRL+SHIFT,Down,smartmovewin,down
bind=CTRL+SHIFT,Left,smartmovewin,left
bind=CTRL+SHIFT,Right,smartmovewin,right

# switch window focus
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right

# swap window
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# workspace switching
bind=SUPER+CTRL,Left,tag,next
bind=SUPER+CTRL,Right,tag,next

# Move windows to workspace
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# Gesturebind
gesturebind=none,left,4,viewtoright
gesturebind=none,right,4,viewtoleft
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview
gesturebind=none,left,3,focusdir,right
gesturebind=none,right,3,focusdir,left

# Screenshots KeyBinds
bind = SUPER,Print,spawn,$HOME/.config/mango/ScreenShot.sh --now
bind = SUPER+SHIFT,Print,spawn,$HOME/.config/mango/ScreenShot.sh --area
bind = SUPER+CTRL,Print,spawn,$HOME/.config/mango/ScreenShot.sh --in5 #screenshot in 5 secs
bind = SUPER+CTRL+SHIFT,Print,spawn,$HOME/.config/mango/ScreenShot.sh --in10 #screenshot in 10 secs

# Laptop multimedia keys for volume and LCD brightness
bind = NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = NONE,XF86MonBrightnessUp,spawn, dms ipc call brightness increment 5 ""
bind = NONE,XF86MonBrightnessDown,spawn, dms ipc call brightness decrement 5 ""

# Requires playerctl
bind = NONE,XF86AudioNext,spawn,playerctl next
bind = NONE,XF86AudioPause,spawn,playerctl play-pause
bind = NONE,XF86AudioPlay,spawn,playerctl play-pause
bind = NONE,XF86AudioPrev,spawn,playerctl previous

# cursor size
#cursor_size=24
#env=XCURSOR_SIZE,24

# window rules
windowrule=title:Authentication required,isfloating:1
windowrule=title:Keybindings,isfloating:1
windowrule=title:Rename*,isfloating:1
windowrule=title:Compressing*,isfloating:1
windowrule=title:File Already Exists*,isfloating:1
windowrule=title:Extracting Files*,isfloating:1
windowrule=title:File Operation Progress*,isfloating:1
windowrule=title:Confirm to replace files*,isfloating:1
windowrule=appid:clipse,isfloating:1,width:600,height:800
windowrule=title:Mission Center,isfloating:1,width:1400,height:800

# # Binds for lid fold toggle
# HandleLidSwitch=ignore
# HandleLidSwitchExternalPower=ignore
# HandleLidSwitchDocked=ignore
# switchbind=fold,spawn,swaylock
# switchbind=unfold,spawn,wlr-dpms on

# keyboard
xkb_rules_layout=no
xkb_rules_variant=nodeadkeys

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1
